name: DevTrack CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      SUPABASE_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.1
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Lint
        id: lint
        run: npm run lint

      - name: Typecheck
        id: typecheck
        run: npm run typecheck

      - name: Test with coverage
        id: unit
        run: npm run test

      - name: Production build
        id: build
        run: npm run build

      - name: Start isolated Supabase and Mailpit
        id: stack
        shell: bash
        run: |
          umask 077
          project="$RUNNER_TEMP/devtrack-supabase"
          export SUPABASE_HOME="$RUNNER_TEMP/devtrack-supabase-home"
          mkdir -p "$project/supabase" "$SUPABASE_HOME"
          cp -R supabase/migrations supabase/templates "$project/supabase/"
          sed 's#^site_url = "http://localhost:3000"$#site_url = "http://127.0.0.1:3100"#' \
            supabase/config.toml > "$project/supabase/config.toml"
          printf '\n[experimental]\nstack = true\n' >> "$project/supabase/config.toml"

          if ! npx --yes supabase@3.3.0 --workdir "$project" start --runtime native > "$project/start.log" 2>&1; then
            echo "::error::Disposable Supabase stack could not start."
            exit 1
          fi
          if ! npx --yes supabase@3.3.0 --workdir "$project" db reset --local > "$project/reset.log" 2>&1; then
            echo "::error::Could not apply migrations to the disposable Supabase database."
            exit 1
          fi
          npx --yes supabase@3.3.0 --workdir "$project" status --output-format json > "$project/status.json" 2> "$project/status.log"
          node .github/scripts/export-supabase-test-env.mjs "$project/status.json"

          psql=$(find "$SUPABASE_HOME/cache/stack/slim-services/postgres" -type f -name psql -print -quit)
          test -x "$psql"
          dirname "$psql" >> "$GITHUB_PATH"
          echo "Disposable Supabase started and reset with repository migrations."

      - name: Integration checks
        id: integration
        run: npm run test:integration

      - name: Install Chromium and OS dependencies
        run: npx playwright install --with-deps chromium

      - name: Browser checks
        id: browser
        run: npm run test:e2e

      - name: Stop isolated Supabase
        if: ${{ always() && steps.stack.outcome != 'skipped' }}
        shell: bash
        run: |
          project="$RUNNER_TEMP/devtrack-supabase"
          export SUPABASE_HOME="$RUNNER_TEMP/devtrack-supabase-home"
          trap 'rm -f -- "$project"/{start.log,reset.log,status.json,status.log,stop.log}' EXIT
          if ! npx --yes supabase@3.3.0 --workdir "$project" stop > "$project/stop.log" 2>&1; then
            echo "::error::Could not stop the disposable Supabase stack."
            exit 1
          fi

      - name: Write quality gate summary
        if: ${{ always() }}
        shell: bash
        env:
          LINT_RESULT: ${{ steps.lint.outcome }}
          TYPECHECK_RESULT: ${{ steps.typecheck.outcome }}
          UNIT_RESULT: ${{ steps.unit.outcome }}
          BUILD_RESULT: ${{ steps.build.outcome }}
          STACK_RESULT: ${{ steps.stack.outcome }}
          INTEGRATION_RESULT: ${{ steps.integration.outcome }}
          BROWSER_RESULT: ${{ steps.browser.outcome }}
        run: |
          summary="$RUNNER_TEMP/quality-summary.md"
          {
            echo '## DevTrack quality gates'
            echo
            echo '| Check | Result |'
            echo '| --- | --- |'
            printf '| %s | %s |\n' \
              'Lint' "$LINT_RESULT" 'Typecheck' "$TYPECHECK_RESULT" \
              'Unit and coverage' "$UNIT_RESULT" 'Production build' "$BUILD_RESULT" \
              'Isolated stack and migrations' "$STACK_RESULT" \
              'Integration' "$INTEGRATION_RESULT" 'Browser' "$BROWSER_RESULT"
          } > "$summary"
          if [ -f test-results/.last-run.json ]; then
            node --input-type=module -e '
              import { readFileSync } from "node:fs";
              const { failedTests } = JSON.parse(readFileSync("test-results/.last-run.json", "utf8"));
              if (Array.isArray(failedTests)) {
                console.log("\nPlaywright failing test cases: " + failedTests.length);
              }
            ' >> "$summary"
          fi
          cat "$summary" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep CI evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-evidence
          path: |
            ${{ runner.temp }}/quality-summary.md
            coverage/
          if-no-files-found: error
          retention-days: 7
